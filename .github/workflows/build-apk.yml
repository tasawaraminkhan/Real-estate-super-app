name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    name: Build PropVerse standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: SDK packages + debug keystore
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: npm install
        working-directory: apps/mobile
        run: npm install

      - name: Expo prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
        env:
          EXPO_NO_TELEMETRY: 1
          CI: "1"

      - name: Configure release signing (debug keystore)
        working-directory: apps/mobile/android
        run: |
          # Patch app/build.gradle to sign release with debug keystore for sideload testing
          if [ -f app/build.gradle ]; then
            cat >> app/build.gradle << 'GRADLE'

// PropVerse CI: sideload-friendly release signing
android {
    signingConfigs {
        release {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
GRADLE
          fi

      - name: Assemble RELEASE (JS bundle embedded — no Metro)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint --stacktrace
        env:
          NODE_ENV: production

      - name: Package APK
        run: |
          APK=$(find apps/mobile/android -path "*release*" -name "*.apk" ! -name "*unaligned*" | head -1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" propverse-standalone.apk
          ls -lh propverse-standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: propverse-apk
          path: propverse-standalone.apk
          retention-days: 30
