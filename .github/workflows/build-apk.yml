name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build PropVerse standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -keystore $HOME/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Install deps
        working-directory: apps/mobile
        run: npm install

      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Sign release with debug keystore
        working-directory: apps/mobile/android
        run: |
          # Write signing config into gradle.properties + patch build.gradle simply
          echo "MYAPP_UPLOAD_STORE_FILE=$HOME/.android/debug.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=android" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=android" >> gradle.properties
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          t = p.read_text()
          if "signingConfigs" not in t or "androiddebugkey" not in t:
              inject = '''
      signingConfigs {
          release {
              storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
              storePassword "android"
              keyAlias "androiddebugkey"
              keyPassword "android"
          }
      }
      buildTypes {
          release {
              signingConfig signingConfigs.release
          }
      }
'''
              # insert inside android { block - after defaultConfig if present
              if "buildTypes {" in t:
                  t = t.replace("buildTypes {", inject.split("buildTypes {")[0] + "buildTypes {", 1)
                  # simpler: append at end of file
              t = t + "\n\nandroid.signingConfigs.release.storeFile = file(System.getenv('HOME') + '/.android/debug.keystore')\n"
              # Actually use a clean approach - create signing.gradle
          Path("signing.gradle").write_text('''
android {
    signingConfigs {
        release {
            storeFile file("${System.env.HOME}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}
''')
          if "signing.gradle" not in t:
              t = t + '\napply from: "signing.gradle"\n'
              p.write_text(t)
          print("signing patched")
          PY

      - name: Assemble release
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          NODE_ENV: production

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: propverse-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
